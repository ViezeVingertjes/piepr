[platformio]
; One env per supported board, named after it. All of them are built by `pio run`
; and released (scripts/release_image.sh); flash one with `pio run -e <board> -t upload`.
default_envs = supermini, xiao-s3

; Shared by the board envs below. Pins and other board details: src/boards/.
[esp32]
platform = espressif32 @ 8.0.0
framework = espidf
; platform 8.0.0 still ships ESP-IDF 6.1.0; pin the newest patch release (6.1.1)
platform_packages = platformio/framework-espidf @ 4.60101.0
board_build.partitions = partitions.csv
monitor_speed = 115200
; ESP-IDF already builds with -Wall -Wextra -Werror but exempts these warnings;
; for our own sources they are errors too.
build_src_flags =
    -Werror=unused-variable
    -Werror=unused-function
    -Werror=unused-but-set-variable
    -Werror=deprecated-declarations
    -Werror=extra
; Generated: secrets.ini -> src/secrets_gen.h, git describe -> src/version_gen.h,
; web/ -> src/web_pages_gen.inc
extra_scripts =
    pre:scripts/gen_secrets.py
    pre:scripts/gen_version.py
    pre:scripts/gen_web.py

[env:supermini]
extends = esp32
board = esp32-c3-devkitm-1
build_flags = -DPIEPR_BOARD_SUPERMINI

[env:xiao-s3]
extends = esp32
board = seeed_xiao_esp32s3
build_flags = -DPIEPR_BOARD_XIAO_S3

; Unit tests on the PC, with AddressSanitizer + UndefinedBehaviorSanitizer
[env:native]
platform = native
test_framework = unity
build_flags = -std=c11 -Wall -Wextra -Werror -g
extra_scripts = pre:scripts/native_sanitizers.py
