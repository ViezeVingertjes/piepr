<text x="40.0" y="48.0" class="h1" text-anchor="start" >Stap 1: welke draad hoort bij welke pin</text>
<text x="40.0" y="76.0" class="sub" text-anchor="start" >De draadkleuren liggen niet vast. Houd de stekker zo:</text>
<rect x="160" y="120" width="120" height="150" rx="6" fill="none" stroke="#9e9e9e" stroke-dasharray="6 4"/><text x="220.0" y="114.0" class="s" text-anchor="middle" >lipje aan de achterkant</text>
<rect x="90" y="150" width="260" height="150" rx="8" fill="#e9eef3" stroke="#3d4f63" stroke-width="2"/><rect x="125" y="160" width="16" height="64" rx="2" fill="#d9b45a" stroke="#8a6a00"/><text x="133.0" y="250.0" class="h1" text-anchor="middle" style="font-size:22px">1</text>
<rect x="163" y="160" width="16" height="64" rx="2" fill="#d9b45a" stroke="#8a6a00"/><text x="171.0" y="250.0" class="h1" text-anchor="middle" style="font-size:22px">2</text>
<rect x="201" y="160" width="16" height="64" rx="2" fill="#d9b45a" stroke="#8a6a00"/><text x="209.0" y="250.0" class="h1" text-anchor="middle" style="font-size:22px">3</text>
<rect x="239" y="160" width="16" height="64" rx="2" fill="#d9b45a" stroke="#8a6a00"/><text x="247.0" y="250.0" class="h1" text-anchor="middle" style="font-size:22px">4</text>
<rect x="277" y="160" width="16" height="64" rx="2" fill="#d9b45a" stroke="#8a6a00"/><text x="285.0" y="250.0" class="h1" text-anchor="middle" style="font-size:22px">5</text>
<rect x="315" y="160" width="16" height="64" rx="2" fill="#d9b45a" stroke="#8a6a00"/><text x="323.0" y="250.0" class="h1" text-anchor="middle" style="font-size:22px">6</text>
<rect x="180" y="300" width="80" height="90" fill="#c9c9c9" stroke="#8a8a8a"/><text x="220.0" y="414.0" class="s" text-anchor="middle" >kabel naar beneden</text>
<text x="220.0" y="440.0" class="s" text-anchor="middle" >contacten naar je toe</text>
<line x1="133" y1="285" x2="133" y2="325" stroke="#d32f2f" stroke-width="3"/><polygon points="133,278 126,292 140,292" fill="#d32f2f"/><text x="60.0" y="346.0" class="t b" text-anchor="start" fill="#d32f2f">pin 1 = links</text>
<text x="430.0" y="133.0" class="t b" text-anchor="start" >1.</text>
<text x="454.0" y="133.0" class="t" text-anchor="start" >Zet de multimeter op de pieptoon.</text>
<text x="430.0" y="169.0" class="t b" text-anchor="start" >2.</text>
<text x="454.0" y="169.0" class="t" text-anchor="start" >Houd één meetpen tegen contact 1 van de stekker.</text>
<text x="430.0" y="205.0" class="t b" text-anchor="start" >3.</text>
<text x="454.0" y="205.0" class="t" text-anchor="start" >Raak met de andere meetpen de losse draden aan tot hij piept.</text>
<text x="430.0" y="241.0" class="t b" text-anchor="start" >4.</text>
<text x="454.0" y="241.0" class="t" text-anchor="start" >Schrijf de kleur van die draad hieronder bij pin 1.</text>
<text x="430.0" y="277.0" class="t b" text-anchor="start" >5.</text>
<text x="454.0" y="277.0" class="t" text-anchor="start" >Doe hetzelfde voor contact 2 tot en met 6.</text>
<text x="430.0" y="328.0" class="t b" text-anchor="start" >Jouw kabel: schrijf de kleur van elke draad onder zijn pin</text>
<rect x="430" y="340" width="84" height="34" fill="#e9eef3" stroke="#c3ced9"/><rect x="430" y="374" width="84" height="44" fill="#fff" stroke="#c3ced9"/><text x="472.0" y="363.0" class="t b" text-anchor="middle" >pin 1</text>
<rect x="518" y="340" width="84" height="34" fill="#e9eef3" stroke="#c3ced9"/><rect x="518" y="374" width="84" height="44" fill="#fff" stroke="#c3ced9"/><text x="560.0" y="363.0" class="t b" text-anchor="middle" >pin 2</text>
<rect x="606" y="340" width="84" height="34" fill="#e9eef3" stroke="#c3ced9"/><rect x="606" y="374" width="84" height="44" fill="#fff" stroke="#c3ced9"/><text x="648.0" y="363.0" class="t b" text-anchor="middle" >pin 3</text>
<rect x="694" y="340" width="84" height="34" fill="#e9eef3" stroke="#c3ced9"/><rect x="694" y="374" width="84" height="44" fill="#fff" stroke="#c3ced9"/><text x="736.0" y="363.0" class="t b" text-anchor="middle" >pin 4</text>
<rect x="782" y="340" width="84" height="34" fill="#e9eef3" stroke="#c3ced9"/><rect x="782" y="374" width="84" height="44" fill="#fff" stroke="#c3ced9"/><text x="824.0" y="363.0" class="t b" text-anchor="middle" >pin 5</text>
<rect x="870" y="340" width="84" height="34" fill="#e9eef3" stroke="#c3ced9"/><rect x="870" y="374" width="84" height="44" fill="#fff" stroke="#c3ced9"/><text x="912.0" y="363.0" class="t b" text-anchor="middle" >pin 6</text>
</svg>
