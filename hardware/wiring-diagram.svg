<text x="40.0" y="48.0" class="h1" text-anchor="start" >Wiring: P1 cable to ESP32-C3 SuperMini</text>
<text x="40.0" y="76.0" class="sub" text-anchor="start" >Board seen from the top: USB-C at the top, the BOOT and RST buttons facing you.</text>
<text x="40.0" y="98.0" class="sub" text-anchor="start" >Wire colours here show the function; your cable's colours differ (see step 1).</text>
<circle cx="760" cy="180" r="13" fill="#d32f2f"/>
<text x="760" y="185" class="num" text-anchor="middle">1</text>
<text x="782.0" y="178.0" class="t b" text-anchor="start" >P1 pin 1</text>
<text x="782.0" y="196.0" class="s" text-anchor="start" >+5 V (DSMR 5 only), through the diode</text>
<circle cx="760" cy="238" r="13" fill="#ef6c00"/>
<text x="760" y="243" class="num" text-anchor="middle">2</text>
<text x="782.0" y="236.0" class="t b" text-anchor="start" >P1 pin 2</text>
<text x="782.0" y="254.0" class="s" text-anchor="start" >Data request</text>
<circle cx="760" cy="288" r="13" fill="#222"/>
<text x="760" y="293" class="num" text-anchor="middle">3</text>
<text x="782.0" y="286.0" class="t b" text-anchor="start" >P1 pin 3</text>
<text x="782.0" y="304.0" class="s" text-anchor="start" >Data ground</text>
<circle cx="760" cy="330" r="13" fill="#222"/>
<text x="760" y="335" class="num" text-anchor="middle">6</text>
<text x="782.0" y="328.0" class="t b" text-anchor="start" >P1 pin 6</text>
<text x="782.0" y="346.0" class="s" text-anchor="start" >Power ground</text>
<circle cx="760" cy="440" r="13" fill="#2e7d32"/>
<text x="760" y="445" class="num" text-anchor="middle">5</text>
<text x="782.0" y="438.0" class="t b" text-anchor="start" >P1 pin 5</text>
<text x="782.0" y="456.0" class="s" text-anchor="start" >Data</text>
<text x="648.0" y="158.0" class="s b" text-anchor="middle" >1N5819 diode, stripe towards the board</text>
<circle cx="760" cy="505" r="13" fill="#9e9e9e"/>
<text x="760" y="510" class="num" text-anchor="middle">4</text>
<text x="782.0" y="503.0" class="t b" text-anchor="start" >P1 pin 4</text>
<text x="782.0" y="521.0" class="s" text-anchor="start" >Not used: cut short, cover with heat shrink</text>
<line x1="522.6" y1="355.0" x2="624.6" y2="375.0" stroke="#777" stroke-dasharray="4 3"/><text x="630.6" y="371.0" class="t b" text-anchor="start" >2.2 kΩ resistor across the 3.3 and 4 pads</text>
<text x="630.6" y="389.0" class="s" text-anchor="start" >either way round; never a plain wire here</text>
<text x="330.0" y="136.0" class="t b" text-anchor="middle" >Power: USB-C charger (5 V)</text>
<line x1="40" y1="670" x2="1140" y2="670" stroke="#d3dbe3"/><text x="40.0" y="700.0" class="t b" text-anchor="start" >Before you start</text>
<text x="40.0" y="724.0" class="s b" text-anchor="start" >1.</text>
<text x="62.0" y="724.0" class="s" text-anchor="start" >Check the colour table from step 1 before soldering anything.</text>
<text x="40.0" y="744.0" class="s b" text-anchor="start" >2.</text>
<text x="62.0" y="744.0" class="s" text-anchor="start" >Slide heat shrink onto the wires before you solder them.</text>
<text x="40.0" y="764.0" class="s b" text-anchor="start" >3.</text>
<text x="62.0" y="764.0" class="s" text-anchor="start" >The board's pins are 3.3 V only: the data wire (pin 5) never goes to 5V.</text>
<text x="40.0" y="784.0" class="s b" text-anchor="start" >4.</text>
<text x="62.0" y="784.0" class="s" text-anchor="start" >Measure with the multimeter (step 6) before you plug into the meter.</text>
</svg>
