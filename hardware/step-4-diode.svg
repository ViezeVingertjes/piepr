<text x="40.0" y="48.0" class="h1" text-anchor="start" >Step 4: the diode in the pin 1 wire</text>
<text x="40.0" y="76.0" class="sub" text-anchor="start" >The diode only lets power flow one way. The stripe must point to the board.</text>
